# Local infra for Refract V1. SQLite + local filesystem media mean the app itself
# needs only Redis. MinIO is included (commented) so V2 can drop in S3 storage.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional, for running locally the way production scales: object storage
  # (REFRACT_STORAGE_BACKEND=s3) and Postgres. `make infra-up` starts them.
  minio:
    # Docker Hub no longer serves MinIO community images; quay.io does. Any
    # S3-compatible server works (SeaweedFS, RustFS, AWS S3): only the
    # REFRACT_S3_* settings change.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    environment:
      MINIO_ROOT_USER: revease
      MINIO_ROOT_PASSWORD: revease-dev-secret
    volumes: ["minio-data:/data"]

  postgres:
    image: postgres:16-alpine
    ports: ["${POSTGRES_PORT:-5432}:5432"]  # POSTGRES_PORT=5442 make infra-up if 5432 is taken
    environment:
      POSTGRES_USER: revease
      POSTGRES_PASSWORD: revease
      POSTGRES_DB: revease
    volumes: ["postgres-data:/var/lib/postgresql/data"]

volumes:
  minio-data:
  postgres-data:
