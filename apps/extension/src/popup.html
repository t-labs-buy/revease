<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; font: 13px system-ui, sans-serif; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: block; font-size: 11px; color: #555; margin-top: 8px; }
      input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; }
      #start { background: #ef4444; color: #fff; }
      #stop { background: #111; color: #fff; }
      button:disabled { opacity: .5; cursor: default; }
      #status { margin-top: 10px; font-size: 12px; color: #333; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Refract Capture</h1>
    <label for="apiBase">API base</label>
    <input id="apiBase" value="http://localhost:8000" />
    <label for="project">Project</label>
    <select id="project"></select>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop &amp; upload</button>
    </div>
    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
