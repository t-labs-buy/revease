[project]
name = "refract-api"
version = "0.1.0"
description = "Refract API — FastAPI, SQLite, local media storage. Per-user spaces behind JWT auth."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4.0",
    "fpdf2>=2.8.0",
    "refract-workflow-graph",
    "anthropic>=0.116.0",
    "langfuse>=4.13.0",
    "opentelemetry-instrumentation-anthropic>=0.62.1",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv.sources]
refract-workflow-graph = { path = "../../packages/workflow-graph/python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
