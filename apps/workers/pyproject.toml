[project]
name = "refract-workers"
version = "0.1.0"
description = "Refract V1 background workers — Celery + Redis. Media/ML/LLM/render pipeline lands in later phases."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "refract-workflow-graph",
    "refract-api",
    "langfuse>=4.13.0",
    "opentelemetry-instrumentation-anthropic>=0.62.1",
    "python-dotenv>=1.2.2",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
# Real speech-to-text. Omitted by default (heavy + CUDA); the transcript adapter
# falls back to an empty transcript when faster-whisper is not installed.
whisper = ["faster-whisper>=1.0.3"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[tool.uv.sources]
refract-workflow-graph = { path = "../../packages/workflow-graph/python", editable = true }
refract-api = { path = "../api", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
