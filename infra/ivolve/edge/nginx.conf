# Single public entry point for RevEase.
#
# The web UI and the API are served from ONE origin instead of two ports:
#   /       -> web  (Next.js :3000)
#   /api/   -> api  (FastAPI :8000, prefix stripped)
# Same origin also means the browser never issues a cross-origin request, so CORS
# stops mattering here.
#
# The listen port is 8090, matched by the right-hand side of the `edge` port
# mapping in docker-compose.yml and by the Forward Port of the nginx-proxy-manager
# host in front of it — change one and you must change all three.
#
# Buffering is off and the body limit removed on purpose: screen recordings are
# PUT as a stream (see app/routers/media.py) and video playback relies on Range
# requests, both of which nginx would otherwise buffer to disk.

server {
    listen 8090;
    server_name _;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Container names, not the compose service names `api` / `web`: this
    # container also sits on the shared ivolve-network, where other stacks already
    # publish containers called `api` and `web`, and their DNS entries win.
    location /api/ {
        proxy_pass http://revease-api:8000/;
    }

    # Object storage (REFRACT_STORAGE_BACKEND=s3, REFRACT_S3_PUBLIC_URL=/s3).
    # Presigned URLs are signed for host `revease-minio:9000` and path
    # `/<bucket>/<key>`; stripping the /s3 prefix and forcing that Host header
    # reproduces them exactly, so SigV4 validates. Uploads (multipart parts) and
    # playback (Range) both pass straight through, unbuffered.
    # Resolved per request (Docker DNS), so the edge still starts on installs
    # that keep the local storage backend and never run MinIO.
    location /s3/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_upstream http://revease-minio:9000;
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host revease-minio:9000;
    }

    location / {
        proxy_pass http://revease-web:3000;
    }
}
