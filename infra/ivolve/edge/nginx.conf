# Single public entry point for RevEase.
#
# The AWS security group on this host only lets 80, 443 and 8020 through, so the
# web UI and the API are served from ONE origin on 8020 instead of two ports:
#   /       -> web  (Next.js :3000)
#   /api/   -> api  (FastAPI :8000, prefix stripped)
# Same origin also means the browser never issues a cross-origin request, so CORS
# stops mattering here.
#
# Buffering is off and the body limit removed on purpose: screen recordings are
# PUT as a stream (see app/routers/media.py) and video playback relies on Range
# requests, both of which nginx would otherwise buffer to disk.

server {
    listen 8080;
    server_name _;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:8000/;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
