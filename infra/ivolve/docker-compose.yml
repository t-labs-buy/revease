# RevEase — ivolve cloud deployment (host: 13.204.129.141).
#
#   cd ~/apps/revease && docker compose up -d
#
# Images are built from ./src, pushed to the host's private registry (registry:2 on
# localhost:5000, htpasswd-protected) AND tagged with the short local name the
# containers actually run under — so `docker ps` reads `revease:api-v1` instead of
# `localhost:5000/revease:api-v1`. build.sh keeps the two in sync. If a local tag
# ever goes missing, recover it with:
#     docker pull localhost:5000/revease:api-v1
#     docker tag  localhost:5000/revease:api-v1 revease:api-v1
#
# Since 2026-09-24 the host runs the images pushed to Gitea's registry instead:
# .env sets IMAGE_NS=reg.ivolve.cloud/ivolve/revease and TAG=v2, which resolves to
# reg.ivolve.cloud/ivolve/revease:api-v2 etc. The host is `docker login`ed to that
# registry as karthik; the previous local-registry settings are kept in .env.bak-v1.
#
# Everything public goes through the `edge` proxy on 8020: this host's security
# group only allows 80, 443 and 8020, and 80/443 already belong to
# nginx-proxy-manager. So web and api share one origin (see edge/nginx.conf).
#
# api + worker share one named volume (SQLite + media + Kokoro TTS model) and must
# stay on the same host — do not split them.

name: revease

services:
  redis:
    image: redis:7-alpine
    container_name: revease-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Object storage for media (REFRACT_STORAGE_BACKEND=s3). The container name
  # is what presigned URLs are signed for; the edge proxies /s3/ to it with that
  # exact Host header (see edge/nginx.conf).
  minio:
    # Pinned copy in our own registry: MinIO stopped serving community images
    # (Docker Hub first, then quay.io refused pulls on 2026-09-25), so a pruned
    # image cache could otherwise leave storage unrecoverable. Mirrored from
    # quay.io/minio/minio at this release; any S3-compatible server also works.
    image: reg.ivolve.cloud/ivolve/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: revease-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-revease}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-please}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-8023}:9001"  # console, loopback only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database (REFRACT_DATABASE_URL=postgresql+psycopg://revease:…@revease-postgres:5432/revease).
  postgres:
    image: postgres:16-alpine
    container_name: revease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: revease
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "revease"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_NS:-revease}:api-${TAG:-v1}
    container_name: revease-api
    build:
      context: ./src
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REFRACT_DATA_DIR: /data
      REFRACT_MEDIA_DIR: /data/media
      # S3 mode: local copies for ffmpeg live on the volume (shared by the
      # api/worker containers on this host, LRU-capped by REFRACT_MEDIA_CACHE_MAX_GB).
      REFRACT_MEDIA_CACHE_DIR: /data/cache
      REFRACT_REDIS_URL: redis://redis:6379/0
      REFRACT_CORS_ORIGINS: ${CORS_ORIGINS:-http://13.204.129.141:8020,https://revease.ivolve.cloud}
    volumes:
      - revease-data:/data
    # Loopback only — the edge proxy is the public path in. Handy for curl on the host.
    ports:
      - "127.0.0.1:${API_DEBUG_PORT:-8021}:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_NS:-revease}:worker-${TAG:-v1}
    container_name: revease-worker
    build:
      context: ./src
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REFRACT_DATA_DIR: /data
      REFRACT_MEDIA_DIR: /data/media
      # S3 mode: local copies for ffmpeg live on the volume (shared by the
      # api/worker containers on this host, LRU-capped by REFRACT_MEDIA_CACHE_MAX_GB).
      REFRACT_MEDIA_CACHE_DIR: /data/cache
      REFRACT_REDIS_URL: redis://redis:6379/0
    volumes:
      - revease-data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # Long CPU-bound work (normalize, transcribe, render): one at a time so a
    # long recording never starves the host.
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "-Q", "media", "-c", "1", "-n", "media@%h"]

  worker-light:
    image: ${IMAGE_NS:-revease}:worker-${TAG:-v1}
    container_name: revease-worker-light
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REFRACT_DATA_DIR: /data
      REFRACT_MEDIA_DIR: /data/media
      # S3 mode: local copies for ffmpeg live on the volume (shared by the
      # api/worker containers on this host, LRU-capped by REFRACT_MEDIA_CACHE_MAX_GB).
      REFRACT_MEDIA_CACHE_DIR: /data/cache
      REFRACT_REDIS_URL: redis://redis:6379/0
    volumes:
      - revease-data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # Quick jobs (documents, snapshots, voice previews) stay responsive while a
    # long encode runs on the media worker.
    # -B: this worker also runs the beat scheduler (hourly retention sweep).
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "-Q", "default", "-c", "3", "-n", "default@%h", "-B", "-s", "/tmp/celerybeat-schedule"]

  web:
    image: ${IMAGE_NS:-revease}:web-${TAG:-v1}
    container_name: revease-web
    build:
      context: ./src
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Baked at build time — the browser calls the API directly. Changing this
        # needs a web image rebuild (./build.sh web), not just a restart. Relative
        # on purpose: `edge` serves web and API from one origin, so one image works
        # on the IP:8020 URL and on any domain later put in front of it.
        NEXT_PUBLIC_API_BASE: ${WEB_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  edge:
    image: nginx:1.27-alpine
    container_name: revease-edge
    restart: unless-stopped
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_PORT:-8020}:8090"
    # Also on ivolve-network so nginx-proxy-manager can reach this container by
    # name when the stack moves to https://<host>/ — NPM cannot route back to the
    # host's public IP from inside its own network. NPM forwards to
    # revease-edge:8090 (the container port, not the published 8020).
    networks:
      - default
      - ivolve-network
    depends_on:
      - web
      - api

networks:
  ivolve-network:
    external: true

volumes:
  revease-data:
  redis-data:
  minio-data:
  postgres-data:
