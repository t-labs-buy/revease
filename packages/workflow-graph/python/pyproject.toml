[project]
name = "refract-workflow-graph"
version = "0.1.0"
description = "Refract Workflow Graph IR — JSON Schema + Python validator (single source of truth)."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refract_workflow_graph"]
# Ship the shared schema + examples inside the wheel so the validator works when installed.
force-include = { "../schema" = "refract_workflow_graph/_schema", "../examples" = "refract_workflow_graph/_examples" }
